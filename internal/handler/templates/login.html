<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion · Blessing Hardware PassGuard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center font-sans antialiased p-4">

<div class="w-full max-w-md">
  <div class="text-center mb-8">
    <div class="inline-flex bg-indigo-600 p-4 rounded-2xl text-white mb-4">
      <i class="fa-solid fa-shield-halved text-3xl"></i>
    </div>
    <h1 class="text-2xl font-bold text-white">Blessing Hardware PassGuard</h1>
    <p class="text-sm text-slate-400 mt-1">Contrôle de sortie du matériel · {{ .PointControle }}</p>
  </div>

  <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-6 shadow-xl space-y-4">
    <div>
      <label class="block text-xs font-medium text-slate-300 mb-1">Adresse e-mail</label>
      <input type="email" id="email" autocomplete="username"
             onkeydown="if(event.key === 'Enter') seConnecter()"
             class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-300 mb-1">Mot de passe</label>
      <input type="password" id="password" autocomplete="current-password"
             onkeydown="if(event.key === 'Enter') seConnecter()"
             class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>

    <div id="erreur" class="hidden text-xs bg-rose-950/60 text-rose-300 border border-rose-500/40 rounded-lg p-3"></div>

    <button onclick="seConnecter()"
            class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg text-sm flex items-center justify-center gap-2">
      <i class="fa-solid fa-right-to-bracket"></i> Se connecter
    </button>
  </div>

  <p class="text-center text-xs text-slate-500 mt-6">
    Environnement : {{ .AppEnv }} · Les mouvements enregistrés sont nominatifs et horodatés.
  </p>
</div>

<script>
  async function seConnecter() {
    const erreur = document.getElementById('erreur');
    erreur.classList.add('hidden');

    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (!res.ok) {
      erreur.textContent = data.error || 'Connexion impossible.';
      erreur.classList.remove('hidden');
      return;
    }
    const suivant = new URLSearchParams(window.location.search).get('next');
    window.location.href = suivant || data.redirection;
  }
</script>
</body>
</html>
